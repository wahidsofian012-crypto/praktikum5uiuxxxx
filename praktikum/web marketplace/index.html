        if (action === "cart-qty") {
          const product = data.products.find(p => p.id === id);
          const nextQty = Number(customerCart[id] || 0) + Number(storeAction.dataset.delta);
          if (nextQty <= 0) delete customerCart[id];
          else if (product && nextQty <= product.stock) customerCart[id] = nextQty;
          else { showToast("Jumlah melebihi stok tersedia."); return; }
          saveCart(); render(); return;
        }
        if (action === "checkout") {
          const items = Object.entries(customerCart).map(([productId, qty]) => ({ product: data.products.find(p => p.id === productId), qty: Number(qty) })).filter(item => item.product && item.qty > 0);
          if (!items.length) { showToast("Keranjang masih kosong."); return; }
          if (items.some(item => item.qty > item.product.stock)) { showToast("Periksa kembali stok produk di keranjang."); return; }
          openModal("checkout"); return;
        }
      }
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) { activePage = pageButton.dataset.page; productSearch = ""; render(); return; }
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      if (action === "new-product") openModal("product");
      else if (action === "edit-product") openModal("product", button.dataset.id);
      else if (action === "new-purchase") openModal("purchase");
      else if (action === "new-order") openModal("order");
      else if (action === "delete-product") {
        const product = data.products.find(p => p.id === button.dataset.id);
        if (product && confirm(`Hapus produk "${product.name}" dari katalog?`)) { data.products = data.products.filter(p => p.id !== product.id); saveData(); render(); showToast("Produk berhasil dihapus."); }
      } else if (action === "export" || action === "export-sales") exportCSV("sales", data.orders.filter(o => action === "export" || o.status === "completed"));
      else if (action === "export-purchases") exportCSV("pembelian", data.purchases);
      else if (action === "reset-data") {
        if (confirm("Pulihkan data contoh? Semua perubahan lokal pada toko ini akan diganti.")) { data = structuredClone(seedData); activeChat = data.chats[0].id; saveData(); render(); showToast("Data contoh berhasil dipulihkan."); }
      }
    });
    document.getElementById("page-content").addEventListener("change", event => {
      if (event.target.id === "order-filter") { orderFilter = event.target.value; render(); }
      if (event.target.matches(".order-status")) {
        const order = data.orders.find(o => o.id === event.target.dataset.id);
        if (order) {
          const next = event.target.value;
          const product = data.products.find(p => p.name === order.product);
          if (next === "cancelled" && order.status !== "cancelled" && order.stockDeducted && product) {
            product.stock += order.qty;
            order.stockDeducted = false;
          } else if (order.status === "cancelled" && next !== "cancelled" && !order.stockDeducted && product) {
            if (product.stock < order.qty) { showToast("Stok tidak cukup untuk mengaktifkan kembali pesanan."); render(); return; }
            product.stock -= order.qty;
            order.stockDeducted = true;
          }
          order.status = next; saveData(); render(); showToast(`Status ${order.id} diperbarui: ${statusLabel(next)}.`);
        }
      }
    });
    document.getElementById("page-content").addEventListener("input", event => {
      if (event.target.id === "table-search") { productSearch = event.target.value; const pos = event.target.selectionStart; render(); const input = document.getElementById("table-search"); input.focus(); input.setSelectionRange(pos, pos); }
      if (event.target.id === "store-search") {
        storeSearch = event.target.value;
        const productGrid = document.getElementById("customer-product-grid");
        if (productGrid) productGrid.innerHTML = renderStoreProducts();
      }
      if (event.target.id === "chat-search") {
        const term = event.target.value.toLowerCase();
        document.querySelectorAll(".conversation").forEach(row => row.classList.toggle("hidden", !row.textContent.toLowerCase().includes(term)));
      }
    });
    document.getElementById("page-content").addEventListener("click", event => {
      const conversation = event.target.closest("[data-chat]");
      if (conversation) { activeChat = conversation.dataset.chat; render(); }
    });

    /* Mengirim balasan admin dan memperbarui preview chat secara persisten. */
    document.getElementById("page-content").addEventListener("submit", event => {
      if (event.target.id !== "chat-form") return;
      event.preventDefault();
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      const chat = data.chats.find(c => c.id === activeChat);
      if (!text || !chat) return;
      const time = new Intl.DateTimeFormat("id-ID", { hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
      chat.messages.push({ text, mine: true, time });
      chat.preview = text;
      saveData(); render();
    });

    /* Pesan storefront disimpan sebagai pesan customer dan langsung terlihat admin. */
    document.getElementById("page-content").addEventListener("submit", event => {
      if (event.target.id !== "store-chat-form") return;
      event.preventDefault();
      const input = document.getElementById("store-chat-input");
      const text = input.value.trim();
      if (!text) return;
      const chat = ensureCustomerChat();
      const time = new Intl.DateTimeFormat("id-ID", { hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
      chat.messages.push({ text, mine: false, time });
      chat.preview = text;
      saveData(); render();
    });

    /* Pencarian global mengarahkan operator ke katalog atau pesanan relevan. */
    document.getElementById("global-search").addEventListener("keydown", event => {
      if (event.key !== "Enter") return;
      const term = event.currentTarget.value.trim();
      if (!term) return;
      const hasProduct = data.products.some(p => [p.name, p.sku, p.category].some(v => v.toLowerCase().includes(term.toLowerCase())));
      activePage = hasProduct ? "products" : "orders"; productSearch = term; render();
      const input = document.getElementById("table-search"); if (input) input.value = term;
    });

    /* Ekspor CSV lokal untuk membuka atau mengolah transaksi di spreadsheet. */
    function exportCSV(kind, rows) {
      if (!rows.length) { showToast("Belum ada data untuk diekspor."); return; }
      const columns = kind === "pembelian" ? ["id", "date", "supplier", "product", "qty", "unitCost", "total", "status"] : ["id", "date", "customer", "product", "qty", "total", "payment", "status"];
      const csv = [columns.join(","), ...rows.map(row => columns.map(key => `"${String(row[key] ?? "").replace(/"/g, '""')}"`).join(","))].join("\r\n");
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
      link.download = `ruang-niaga-${kind}-${new Date().toISOString().slice(0, 10)}.csv`;
      link.click(); URL.revokeObjectURL(link.href); showToast("File CSV berhasil diunduh.");
    }

    /* Kontrol global: menu ponsel, dialog, notifikasi, dan render awal. */
    document.getElementById("menu-toggle").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
    document.getElementById("open-storefront").addEventListener("click", () => { storePage = "shop"; setView("customer"); });
    document.getElementById("close-modal").addEventListener("click", closeModal);
    document.getElementById("modal-backdrop").addEventListener("click", event => { if (event.target.id === "modal-backdrop") closeModal(); });
    document.addEventListener("keydown", event => { if (event.key === "Escape") closeModal(); });
    document.getElementById("notification-button").addEventListener("click", () => showToast(`${data.orders.filter(o => o.status === "pending").length} pesanan menunggu untuk diproses.`));
    render();
  </script>
</body>
</html>
