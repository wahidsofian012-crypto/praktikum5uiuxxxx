<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox 3: Galeri Foto</title>
    <link rel="stylesheet" href="css/flex-gallery.css">
</head>
<body>
    <main class="photo-gallery" aria-label="Galeri foto burung">
        <div class="photo-row photo-row--three">
            <figure><img src="img/burung1.png" alt="Sepasang burung di dahan"><figcaption>Sepasang burung</figcaption></figure>
            <figure><img src="img/burung2.png" alt="Burung berjalan di atas dahan"><figcaption>Burung berjalan</figcaption></figure>
            <figure><img src="img/burung3.png" alt="Burung putih bertengger"><figcaption>Burung bertengger</figcaption></figure>
        </div>
        <div class="photo-row photo-row--five">
            <figure><img src="img/burung4.png" alt="Burung di antara pepohonan"><figcaption>Di pepohonan</figcaption></figure>
            <figure><img src="img/burung1.png" alt="Dua burung di antara dedaunan"><figcaption>Di antara dedaunan</figcaption></figure>
            <figure><img src="img/burung2.png" alt="Burung di dahan, tampak samping"><figcaption>Tampak samping</figcaption></figure>
            <figure><img src="img/burung3.png" alt="Burung di dahan dalam suasana teduh"><figcaption>Suasana teduh</figcaption></figure>
            <figure><img src="img/burung4.png" alt="Burung di habitat hutan"><figcaption>Habitat hutan</figcaption></figure>
        </div>
    </main>
</body>
</html>
