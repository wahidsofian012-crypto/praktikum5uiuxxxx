<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box 2: Positioning</title>
    <link rel="stylesheet" href="css/box2.css">
</head>
<body>
    <main class="positioning-demo">
        <header class="positioning-header">Header</header>
        <section class="positioning-row">
            <aside class="positioning-label">01</aside>
            <article class="positioning-content positioning-content--orange">Konten utama</article>
        </section>
        <section class="positioning-row">
            <aside class="positioning-label">02</aside>
            <article class="positioning-content positioning-content--blue">Konten tambahan</article>
        </section>
        <section class="positioning-row">
            <aside class="positioning-label">03</aside>
            <article class="positioning-content positioning-content--green">Konten penutup</article>
        </section>
    </main>
</body>
</html>
