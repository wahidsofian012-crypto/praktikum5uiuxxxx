<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox 4: Variasi Layout</title>
    <link rel="stylesheet" href="css/flexbox4.css">
</head>
<body>
    <main class="layout-examples">
        <section class="example">
            <h1>Layout 1</h1>
            <div class="layout-one">
                <nav aria-label="Navigasi layout satu">Nav</nav>
                <div class="layout-one__content">
                    <header>Header</header>
                    <div class="layout-one__middle">
                        <article>Article</article>
                        <aside>Aside</aside>
                    </div>
                    <footer>Footer</footer>
                </div>
            </div>
        </section>
        <section class="example">
            <h2>Layout 2</h2>
            <div class="layout-two">
                <header>Header</header>
                <div class="layout-two__middle">
                    <aside>Aside</aside>
                    <article>
                        <h3>Article</h3>
                        <div class="layout-two__tiles" aria-label="Tiga foto">
                            <img src="img/burung1.png" alt="Sepasang burung">
                            <img src="img/burung2.png" alt="Burung berjalan">
                            <img src="img/burung3.png" alt="Burung bertengger">
                        </div>
                    </article>
                </div>
                <footer>Footer</footer>
            </div>
        </section>
    </main>
</body>
</html>
