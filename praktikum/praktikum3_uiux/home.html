
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 3 - Layout Web</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            display: block;
            width: 100%;
            height: 100px;
            border: 0;
        }

        .container {
            display: flex;
            min-height: 400px;
        }

        .menu {
            width: 25%;
            min-height: 400px;
            border: 0;
        }

        .konten {
            width: 75%;
            min-height: 400px;
            border: 0;
        }

        .footer {
            display: block;
            width: 100%;
            height: 65px;
            border: 0;
        }
    </style>
</head>
<body>

    <iframe src="header.html"
            class="header"
            title="Header"></iframe>

    <div class="container">
        <iframe src="menu.html"
                class="menu"
                title="Menu"></iframe>

        <iframe src="praktikum1.html"
                name="konten"
                class="konten"
                title="Konten utama"></iframe>
    </div>

    <iframe src="footer.html"
            class="footer"
            title="Footer"></iframe>

</body>
</html>
